fullnameOverride: kube-prometheus-stack

alertmanager:
  enabled: false

nodeExporter:
  enabled: false

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  create: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi

prometheus:
  prometheusSpec:
    retention: 6h
    scrapeInterval: 15s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

grafana:
  fullnameOverride: kube-prometheus-stack-grafana
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: false
  serviceMonitor:
    # The chart default of 30s is longer than the 15s scrape interval, and Prometheus rejects that.
    scrapeTimeout: 10s
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 320Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 128Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      defaultDatasourceEnabled: true
  additionalDataSources:
    # Jaeger: "Logs for this span" opens the matching Loki lines, found by trace id.
    - name: Jaeger
      type: jaeger
      uid: jaeger
      access: proxy
      url: http://jaeger-query.observability.svc.cluster.local:16686
      editable: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          customQuery: true
          query: '{namespace="shop"} |= "${__trace.traceId}"'
    # Loki: a trace_id inside a log line becomes a link that opens the trace in Jaeger.
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      editable: false
      jsonData:
        maxLines: 1000
        derivedFields:
          - name: trace_id
            matcherRegex: '"trace_id":"(\w+)"'
            datasourceUid: jaeger
            url: "${__value.raw}"
            urlDisplayLabel: Open trace in Jaeger
