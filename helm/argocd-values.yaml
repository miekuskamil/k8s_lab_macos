global:
  domain: localhost

configs:
  params:
    server.insecure: true
  secret:
    # bcrypt hash of the lab default password "k8s-lab-admin" for user "admin".
    # Make a new one with: htpasswd -nbBC 10 "" 'new-password' | tr -d ':\n' | sed 's/$2y/$2a/'
    argocdServerAdminPassword: "$2a$10$MrnRhbV0j5vAWc48O0jOwu9OsymBFqdnWDEKnKWNvaSEwwluG3koe"
    argocdServerAdminPasswordMtime: "2026-11-11T00:00:00Z"

dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    # 512Mi was too low. The controller was OOM-killed while it compared the
    # kube-prometheus-stack chart on first sync.
    limits:
      cpu: "1"
      memory: 1Gi

server:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 96Mi
