# Headlamp, a general Kubernetes web UI: every namespace, pod logs, exec, events, YAML edits.
# No login: Headlamp uses its own service account, bound to cluster-admin, for every request.
# Anyone who can open localhost:4466 can change anything. That is acceptable only because the
# port-forward listens on your machine alone, the same reason Kiali uses anonymous login.
config:
  inCluster: true
  unsafeUseServiceAccountToken: true

serviceAccount:
  create: true
  name: headlamp

clusterRoleBinding:
  create: true
  clusterRoleName: cluster-admin

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 256Mi
