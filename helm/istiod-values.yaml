profile: ambient

pilot:
  autoscaleEnabled: false
  env:
    # Give every ServiceEntry a virtual IP from 240.240.0.0/16. ztunnel matches traffic
    # by IP, so an external host needs one to reach its waypoint (course module 12).
    PILOT_ENABLE_IP_AUTOALLOCATE: "true"
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

meshConfig:
  enableTracing: true
  accessLogFile: ""
  defaultConfig:
    holdApplicationUntilProxyStarts: false
  extensionProviders:
    - name: jaeger-otlp
      opentelemetry:
        service: jaeger-collector.observability.svc.cluster.local
        port: 4317
