# The lab's own certificate authority, managed by cert-manager.
#   1. selfsigned   signs one certificate: the lab root CA.
#   2. lab-root-ca  that root CA. Its key pair lives in the Secret cert-manager/lab-root-ca.
#   3. lab-ca       a ClusterIssuer that signs certificates for any namespace with the root CA.
# Course module 11 asks lab-ca for the shop's HTTPS certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k8s-lab root CA
  secretName: lab-root-ca
  duration: 87600h      # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-root-ca
