# Scenario B: fault injection on /api/orders, a 500 ms delay on every request
# and an HTTP 503 on 10% of requests. The route also keeps the 90/10 canary split.
#
# Gateway API HTTPRoute has no fault injection, so this scenario uses a VirtualService.
# The HTTPRoute and the VirtualService must not target the same host at once,
# so delete the HTTPRoute first.
#
# Apply:
#   kubectl -n shop delete httproute backend-route
#   kubectl apply -f manifests/scenarios/b-fault-injection.yaml
# Observe: ./scripts/traffic-test.sh 200
# Revert:
#   kubectl delete -f manifests/scenarios/b-fault-injection.yaml
#   kubectl apply -f manifests/istio/backend-route.yaml
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend
  namespace: shop
spec:
  host: backend.shop.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backend
  namespace: shop
spec:
  hosts:
    - backend.shop.svc.cluster.local
  http:
    - name: orders-faults
      match:
        - uri:
            prefix: /api/orders
      fault:
        delay:
          fixedDelay: 500ms
          percentage:
            value: 100
        abort:
          httpStatus: 503
          percentage:
            value: 10
      route:
        - destination:
            host: backend.shop.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: backend.shop.svc.cluster.local
            subset: v2
          weight: 10
    - name: default
      route:
        - destination:
            host: backend.shop.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: backend.shop.svc.cluster.local
            subset: v2
          weight: 10
