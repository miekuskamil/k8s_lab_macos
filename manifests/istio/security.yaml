# Require mTLS for every workload in the shop namespace. ztunnel enforces this.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: shop
spec:
  mtls:
    mode: STRICT
---
# L4 policy enforced by ztunnel. Only the backend identity may open connections to Redis.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: redis-allow-backend
  namespace: shop
spec:
  selector:
    matchLabels:
      app: redis
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/shop/sa/backend
---
# L7 policy enforced by the waypoint. Only the frontend may call the backend Services.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: backend-allow-frontend
  namespace: shop
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: backend
    - group: ""
      kind: Service
      name: backend-v1
    - group: ""
      kind: Service
      name: backend-v2
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/shop/sa/frontend
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/api/*"]
---
# L4 policy enforced by ztunnel on the backend pods. Without it, a client that does not
# use the waypoint (a sidecar workload, or anything that dials a pod IP) reaches the
# backend directly and skips the L7 policy above. Only the waypoint may open connections
# to the backend, plus Prometheus for the /metrics scrape.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: backend-only-from-waypoint
  namespace: shop
spec:
  selector:
    matchLabels:
      app: backend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/shop/sa/waypoint
              - cluster.local/ns/observability/sa/kube-prometheus-stack-prometheus
