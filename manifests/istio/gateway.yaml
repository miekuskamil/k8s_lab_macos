# North-south entry point. Istio creates an Envoy Deployment and a LoadBalancer
# Service named shop-gateway-istio in shop-ingress. OrbStack publishes that
# LoadBalancer on localhost:8080.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop-gateway
  namespace: shop-ingress
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: shop
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: shop
spec:
  parentRefs:
    - name: shop-gateway
      namespace: shop-ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000
