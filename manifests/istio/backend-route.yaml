# Baseline routing for the backend: all traffic goes to v1.
# Scenario A in manifests/scenarios changes the weights to 90/10.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
  namespace: shop
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: backend
      port: 8000
  rules:
    - backendRefs:
        - name: backend-v1
          port: 8000
          weight: 100
        - name: backend-v2
          port: 8000
          weight: 0
