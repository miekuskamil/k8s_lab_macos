apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: k8s-lab
  namespace: argocd
spec:
  description: Local OrbStack reference architecture
  sourceRepos:
    - https://github.com/miekuskamil/k8s_lab_macos
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
