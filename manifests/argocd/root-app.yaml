# App of apps. Syncing this one Application creates every Application in manifests/argocd/apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-lab
  source:
    repoURL: https://github.com/miekuskamil/k8s_lab_macos
    targetRevision: main
    path: manifests/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
