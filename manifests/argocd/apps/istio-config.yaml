# selfHeal is off on purpose. When you apply a scenario by hand, this Application
# turns OutOfSync and shows the drift, but ArgoCD leaves your experiment running.
# Press Sync (or run "argocd app sync istio-config") to return to the Git state.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: k8s-lab
  source:
    repoURL: https://github.com/miekuskamil/k8s_lab_macos
    targetRevision: main
    path: manifests/istio
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
