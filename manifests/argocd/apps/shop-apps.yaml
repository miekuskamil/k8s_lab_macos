apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: k8s-lab
  source:
    repoURL: https://github.com/miekuskamil/k8s_lab_macos
    targetRevision: main
    path: manifests/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  # These two variables are experiment controls. ArgoCD ignores them, so a manual
  # "kubectl set env" stays in place until you undo it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.spec.containers[].env[] | select(.name == "RATE_LIMIT_RPS" or .name == "EXTRA_LATENCY_MS")
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
