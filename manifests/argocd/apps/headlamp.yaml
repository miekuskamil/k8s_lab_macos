# Headlamp, a general Kubernetes web UI: pods, logs, shells, events and YAML for every namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: k8s-lab
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.46.0
      helm:
        releaseName: headlamp
        valueFiles:
          - $values/helm/headlamp-values.yaml
    - repoURL: https://github.com/miekuskamil/k8s_lab_macos
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  # The chart sets hostUsers: true. Kubernetes 1.31 has user namespaces switched off
  # (feature gate UserNamespacesSupport), so the API server drops the field and the
  # Deployment would show OutOfSync forever.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: headlamp
      jsonPointers:
        - /spec/template/spec/hostUsers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
