# Developers can manage workloads in "shop" but cannot read Secrets or change quotas.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-developer
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/portforward", "services", "endpoints", "configmaps", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-viewer
  namespace: shop
rules:
  - apiGroups: ["", "apps", "gateway.networking.k8s.io", "networking.istio.io", "security.istio.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-developers
  namespace: shop
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: shop-developers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shop-developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-viewers
  namespace: shop
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: shop-viewers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shop-viewer
---
# Prometheus needs read access to discover pods and services in the shop namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: shop
subjects:
  - kind: ServiceAccount
    name: kube-prometheus-stack-prometheus
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
