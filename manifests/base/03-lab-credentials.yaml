# Default credentials for this local lab. They are in Git on purpose, so every
# clone gets the same logins and the README can list them.
# Do not reuse this pattern on a shared or internet-facing cluster. See learning.md, section 6.
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: shop
type: Opaque
stringData:
  password: k8s-lab-redis
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: observability
type: Opaque
stringData:
  admin-user: admin
  admin-password: k8s-lab-admin
