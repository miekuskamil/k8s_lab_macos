# Budgets sized for an OrbStack VM with about 8 GiB of RAM and 4 CPUs.
# Every pod in a quota-controlled namespace must declare requests and limits,
# so each namespace also gets a LimitRange that fills in defaults.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: shop-quota
  namespace: shop
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 3Gi
    pods: "30"
    services: "15"
    persistentvolumeclaims: "0"
    secrets: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: shop-limits
  namespace: shop
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 192Mi
      max:
        cpu: "1"
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: shop-ingress-quota
  namespace: shop-ingress
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: shop-ingress-limits
  namespace: shop-ingress
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 96Mi
      default:
        cpu: 500m
        memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-quota
  namespace: observability
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: 2560Mi
    limits.cpu: "6"
    limits.memory: 6Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: observability-limits
  namespace: observability
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
