# kubeadm init reads this file on cks-cp. create.sh fills in the version and the address.
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: __CP_IP__
nodeRegistration:
  name: cks-cp
  criSocket: unix:///run/containerd/containerd.sock
  ignorePreflightErrors:
    - Swap                 # OrbStack machines share the host's zram swap
    - SystemVerification   # OrbStack's kernel config isn't where kubeadm looks for it
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
clusterName: cks
kubernetesVersion: v__K8S_VERSION__
controlPlaneEndpoint: __CP_IP__:6443
networking:
  podSubnet: 10.244.0.0/16      # Calico's default 192.168.0.0/16 overlaps OrbStack's 192.168.139.0/24
  serviceSubnet: 10.96.0.0/12
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
failSwapOn: false               # swap exists on OrbStack; the kubelet keeps pods out of it
memorySwap:
  swapBehavior: NoSwap
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
kind: KubeProxyConfiguration
conntrack:
  maxPerCore: 0                 # an OrbStack machine may not resize the shared kernel's conntrack table
  tcpEstablishedTimeout: 0s
  tcpCloseWaitTimeout: 0s
