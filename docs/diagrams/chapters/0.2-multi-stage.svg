<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1600" height="860" fill="#ffffff"/>
<rect x="40.0" y="34.0" width="6.0" height="40.0" rx="3.0" fill="#7c3aed" stroke="none"/>
<text x="62" y="66" font-size="34" font-weight="700" fill="#0f172a">A multi-stage build <tspan fill="#7c3aed">ships only what runs</tspan></text>
<text x="62.0" y="104.0" font-size="20.0" fill="#475569" text-anchor="start">The build stage holds the compiler and the source. The final image holds one binary.</text>
<rect x="40.0" y="150.0" width="1520.0" height="670.0" rx="16.0" fill="#f2edff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="58.0" y="180.0" font-size="18.0" fill="#5b21b6" font-weight="700" text-anchor="start">BuildKit</text>
<rect x="80.0" y="210.0" width="640.0" height="570.0" rx="16.0" fill="#fff2e8" stroke="#ea580c" stroke-width="1.6"/>
<text x="98.0" y="240.0" font-size="18.0" fill="#9a3412" font-weight="700" text-anchor="start">stage build: golang image, 430 MB</text>
<rect x="120.0" y="280.0" width="560.0" height="80.0" rx="10.0" fill="#f1f4f8" stroke="#475569" stroke-width="1.8"/>
<text x="400.0" y="312.6" font-size="19.0" fill="#0f172a" font-weight="700" text-anchor="middle">Go toolchain</text>
<text x="400.0" y="334.7" font-size="17.0" fill="#475569" text-anchor="middle">compiler, standard library</text>
<rect x="120.0" y="400.0" width="560.0" height="80.0" rx="10.0" fill="#f1f4f8" stroke="#475569" stroke-width="1.8"/>
<text x="400.0" y="432.6" font-size="19.0" fill="#0f172a" font-weight="700" text-anchor="middle">source code</text>
<text x="400.0" y="454.7" font-size="17.0" fill="#475569" text-anchor="middle">go.mod, main.go</text>
<rect x="120.0" y="520.0" width="560.0" height="80.0" rx="10.0" fill="#e7f7f0" stroke="#059669" stroke-width="1.8"/>
<text x="400.0" y="552.6" font-size="19.0" fill="#0f172a" font-weight="700" text-anchor="middle">go build</text>
<text x="400.0" y="574.7" font-size="17.0" fill="#475569" text-anchor="middle">CGO_ENABLED=0</text>
<rect x="120.0" y="660.0" width="560.0" height="80.0" rx="10.0" fill="#fff2e8" stroke="#ea580c" stroke-width="1.8"/>
<text x="400.0" y="692.6" font-size="19.0" fill="#0f172a" font-weight="700" text-anchor="middle">/out/hits</text>
<text x="400.0" y="714.7" font-size="17.0" fill="#475569" text-anchor="middle">static binary, 8 MB</text>
<rect x="880.0" y="210.0" width="640.0" height="570.0" rx="16.0" fill="#eaf1ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="898.0" y="240.0" font-size="18.0" fill="#1e40af" font-weight="700" text-anchor="start">final stage: scratch, 8 MB</text>
<rect x="920.0" y="280.0" width="560.0" height="80.0" rx="10.0" fill="#fff2e8" stroke="#ea580c" stroke-width="1.8"/>
<text x="1200.0" y="312.6" font-size="19.0" fill="#0f172a" font-weight="700" text-anchor="middle">/hits</text>
<text x="1200.0" y="334.7" font-size="17.0" fill="#475569" text-anchor="middle">the only file</text>
<rect x="920.0" y="400.0" width="560.0" height="80.0" rx="10.0" fill="#fdeeee" stroke="#dc2626" stroke-width="1.8"/>
<text x="1200.0" y="432.6" font-size="19.0" fill="#0f172a" font-weight="700" text-anchor="middle">USER 65532</text>
<text x="1200.0" y="454.7" font-size="17.0" fill="#475569" text-anchor="middle">not root</text>
