<text x="10" y="34" font-size="16" font-weight="700" text-anchor="start" fill="#24292f">Traffic flow</text>
<text x="10" y="52" font-size="16" font-weight="700" text-anchor="start" fill="#24292f">and trust zones</text>
<text x="382" y="290" font-size="10" font-weight="400" text-anchor="start" fill="#24292f">outside the mesh</text>
<text x="10" y="420" font-size="12" font-weight="700" text-anchor="start" fill="#24292f">Legend</text>
<text x="78" y="444" font-size="11" font-weight="400" text-anchor="start" fill="#24292f">HBONE mTLS</text>
<text x="78" y="466" font-size="11" font-weight="400" text-anchor="start" fill="#24292f">plaintext</text>
<text x="78" y="488" font-size="11" font-weight="400" text-anchor="start" fill="#24292f">control, telemetry</text>
<text x="10" y="512" font-size="10" font-weight="400" text-anchor="start" fill="#24292f">Numbers give the hop order</text>
<text x="10" y="525" font-size="10" font-weight="400" text-anchor="start" fill="#24292f">of one request. The trust</text>
<text x="10" y="538" font-size="10" font-weight="400" text-anchor="start" fill="#24292f">zone is the namespace.</text>
<text x="10" y="551" font-size="10" font-weight="400" text-anchor="start" fill="#24292f">ztunnel listens inside each</text>
<text x="10" y="564" font-size="10" font-weight="400" text-anchor="start" fill="#24292f">pod (ambient in-pod mode),</text>
<text x="10" y="577" font-size="10" font-weight="400" text-anchor="start" fill="#24292f">so plain text never leaves</text>
<text x="10" y="590" font-size="10" font-weight="400" text-anchor="start" fill="#24292f">a pod: frontend to backend</text>
<text x="10" y="603" font-size="10" font-weight="400" text-anchor="start" fill="#24292f">is mTLS end to end.</text>
