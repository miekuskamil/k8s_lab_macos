<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" role="img" aria-labelledby="t d" font-family="-apple-system, Helvetica, Arial, sans-serif">
<title id="t">Traffic flow and trust zones</title><desc id="d">A request enters at localhost:8080, crosses the k3d load balancer, the shop-gateway, ztunnel, the waypoint and a backend, and reaches Redis. HBONE mTLS edges are thick blue, plaintext edges are black, telemetry edges are dashed gray.</desc>
