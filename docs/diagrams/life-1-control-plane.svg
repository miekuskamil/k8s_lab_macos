<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1575" viewBox="0 0 1560 1575" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1560" height="1575" fill="#ffffff"/>
<defs>
<marker id="a24292f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#24292f"/></marker>
<marker id="a8250df" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8250df"/></marker>
<marker id="abc4c00" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#bc4c00"/></marker>
<marker id="acf222e" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#cf222e"/></marker>
</defs>
<rect x="320" y="160" width="780" height="1035" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="7 5"/>
<text x="332" y="184" font-size="16" font-weight="700" fill="#24292f">API server (inside the k3s server process)</text>
<rect x="40" y="200" width="250" height="177" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
<text x="52" y="224" font-size="16" font-weight="700" fill="#24292f">kubectl apply</text>
<text x="52" y="246" font-size="14" fill="#57606a">an HTTP client</text>
<text x="52" y="265" font-size="14" fill="#57606a">POST /apis/apps/v1/</text>
<text x="52" y="284" font-size="14" fill="#57606a">namespaces/course-life/</text>
<text x="52" y="303" font-size="14" fill="#57606a">deployments</text>
<text x="52" y="322" font-size="14" fill="#57606a">client certificate:</text>
<text x="52" y="341" font-size="14" fill="#57606a">system:admin, group</text>
<text x="52" y="360" font-size="14" fill="#57606a">system:masters</text>
<rect x="350" y="200" width="430" height="139" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="362" y="224" font-size="16" font-weight="700" fill="#24292f">1. Authentication: who are you?</text>
<text x="362" y="246" font-size="14" fill="#57606a">TLS client certificate signed by the cluster&#x27;s client</text>
<text x="362" y="265" font-size="14" fill="#57606a">CA, or a signed service account token</text>
<text x="362" y="284" font-size="14" fill="#57606a">--anonymous-auth=false: no identity, no entry</text>
<text x="362" y="303" font-size="14" fill="#57606a">result: user system:admin, groups system:masters,</text>
<text x="362" y="322" font-size="14" fill="#57606a">system:authenticated</text>
<rect x="350" y="369" width="430" height="158" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="362" y="393" font-size="16" font-weight="700" fill="#24292f">2. Authorization: may you do this?</text>
<text x="362" y="415" font-size="14" fill="#57606a">--authorization-mode=Node,RBAC, asked in order; the</text>
<text x="362" y="434" font-size="14" fill="#57606a">first yes wins</text>
<text x="362" y="453" font-size="14" fill="#57606a">Node: a kubelet only touches its own node&#x27;s pods and</text>
<text x="362" y="472" font-size="14" fill="#57606a">secrets</text>
<text x="362" y="491" font-size="14" fill="#57606a">RBAC: Roles and ClusterRoles through bindings;</text>
<text x="362" y="510" font-size="14" fill="#57606a">system:masters skips RBAC</text>
<rect x="350" y="557" width="430" height="120" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="362" y="581" font-size="16" font-weight="700" fill="#24292f">3. Mutating admission: should it change?</text>
<text x="362" y="603" font-size="14" fill="#57606a">built-in plugins fill defaults: service account,</text>
<text x="362" y="622" font-size="14" fill="#57606a">default tolerations</text>
<text x="362" y="641" font-size="14" fill="#57606a">webhooks: Kyverno add-defaults (module 26), Istio&#x27;s</text>
<text x="362" y="660" font-size="14" fill="#57606a">sidecar injector</text>
<rect x="350" y="707" width="430" height="101" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="362" y="731" font-size="16" font-weight="700" fill="#24292f">4. Schema validation: is it well formed?</text>
<text x="362" y="753" font-size="14" fill="#57606a">the OpenAPI schema and built-in rules</text>
<text x="362" y="772" font-size="14" fill="#57606a">replicas: -1 gives 422: must be greater than or equal</text>
<text x="362" y="791" font-size="14" fill="#57606a">to 0</text>
<rect x="350" y="838" width="430" height="120" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="362" y="862" font-size="16" font-weight="700" fill="#24292f">5. Validating admission: is it allowed?</text>
<text x="362" y="884" font-size="14" fill="#57606a">NodeRestriction, ValidatingAdmissionPolicy (CEL)</text>
<text x="362" y="903" font-size="14" fill="#57606a">webhooks: Istio config validation, Kyverno Enforce</text>
<text x="362" y="922" font-size="14" fill="#57606a">policies</text>
<text x="362" y="941" font-size="14" fill="#57606a">an AuthorizationPolicy using request.colour: denied</text>
<rect x="350" y="988" width="430" height="120" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<text x="362" y="1012" font-size="16" font-weight="700" fill="#24292f">6. Storage: write it</text>
<text x="362" y="1034" font-size="14" fill="#57606a">--etcd-servers=unix://kine.sock</text>
<text x="362" y="1053" font-size="14" fill="#57606a">the object gets a resourceVersion (16403 in the test</text>
<text x="362" y="1072" font-size="14" fill="#57606a">run)</text>
<text x="362" y="1091" font-size="14" fill="#57606a">the reply goes back to kubectl: 201 Created</text>
<rect x="820" y="369" width="250" height="158" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="832" y="393" font-size="16" font-weight="700" fill="#24292f">Refused: straight back</text>
<text x="832" y="415" font-size="14" fill="#57606a">401 Unauthorized (gate 1)</text>
<text x="832" y="434" font-size="14" fill="#57606a">403 Forbidden (gate 2)</text>
<text x="832" y="453" font-size="14" fill="#57606a">400 or 422, or a webhook&#x27;s</text>
<text x="832" y="472" font-size="14" fill="#57606a">message (gates 3 to 5)</text>
<text x="832" y="491" font-size="14" fill="#57606a">nothing stored, no watcher</text>
<text x="832" y="510" font-size="14" fill="#57606a">ever hears of it</text>
<rect x="820" y="988" width="250" height="177" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
<text x="832" y="1012" font-size="16" font-weight="700" fill="#24292f">Watch cache</text>
<text x="832" y="1034" font-size="14" fill="#57606a">every watcher holds one long</text>
<text x="832" y="1053" font-size="14" fill="#57606a">HTTP stream: ?watch=1</text>
<text x="832" y="1072" font-size="14" fill="#57606a">events: ADDED, MODIFIED,</text>
<text x="832" y="1091" font-size="14" fill="#57606a">DELETED</text>
<text x="832" y="1110" font-size="14" fill="#57606a">a resourceVersion lets a</text>
<text x="832" y="1129" font-size="14" fill="#57606a">watcher resume after a</text>
<text x="832" y="1148" font-size="14" fill="#57606a">reconnect</text>
<rect x="350" y="1265" width="430" height="158" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<text x="362" y="1289" font-size="16" font-weight="700" fill="#24292f">kine + SQLite</text>
<text x="362" y="1311" font-size="14" fill="#57606a">k3s&#x27; default datastore: kine speaks the etcd API,</text>
<text x="362" y="1330" font-size="14" fill="#57606a">stores rows in SQLite (state.db)</text>
<text x="362" y="1349" font-size="14" fill="#57606a">each row carries a revision; kine polls for new rows</text>
<text x="362" y="1368" font-size="14" fill="#57606a">and turns them into watch events</text>
<text x="362" y="1387" font-size="14" fill="#57606a">etcd in other clusters: the same API, replicated with</text>
<text x="362" y="1406" font-size="14" fill="#57606a">Raft</text>
<rect x="1150" y="160" width="370" height="120" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
<text x="1162" y="184" font-size="16" font-weight="700" fill="#24292f">Deployment controller</text>
<text x="1162" y="206" font-size="14" fill="#57606a">watches Deployments and ReplicaSets</text>
<text x="1162" y="225" font-size="14" fill="#57606a">hashes the pod template into pod-template-hash</text>
<text x="1162" y="244" font-size="14" fill="#57606a">writes a ReplicaSet; a rolling update scales</text>
<text x="1162" y="263" font-size="14" fill="#57606a">two of them in steps</text>
<rect x="1150" y="298" width="370" height="120" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
<text x="1162" y="322" font-size="16" font-weight="700" fill="#24292f">ReplicaSet controller</text>
<text x="1162" y="344" font-size="14" fill="#57606a">counts the pods that match its selector</text>
<text x="1162" y="363" font-size="14" fill="#57606a">too few: creates Pods with an ownerReference</text>
<text x="1162" y="382" font-size="14" fill="#57606a">too many: deletes, unscheduled and unready</text>
<text x="1162" y="401" font-size="14" fill="#57606a">first</text>
<rect x="1150" y="436" width="370" height="120" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
<text x="1162" y="460" font-size="16" font-weight="700" fill="#24292f">Scheduler</text>
<text x="1162" y="482" font-size="14" fill="#57606a">watches Pods with an empty spec.nodeName</text>
<text x="1162" y="501" font-size="14" fill="#57606a">filter, score, then bind writes the node</text>
<text x="1162" y="520" font-size="14" fill="#57606a">nothing fits: tries preemption, else the pod</text>
<text x="1162" y="539" font-size="14" fill="#57606a">stays Pending</text>
<rect x="1150" y="574" width="370" height="101" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
<text x="1162" y="598" font-size="16" font-weight="700" fill="#24292f">kubelet (one per node)</text>
<text x="1162" y="620" font-size="14" fill="#57606a">watches Pods bound to its own node</text>
<text x="1162" y="639" font-size="14" fill="#57606a">runs them through CRI and CNI, reports status</text>
<text x="1162" y="658" font-size="14" fill="#57606a">the Node authorizer keeps it to its own pods</text>
<rect x="1150" y="693" width="370" height="82" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
<text x="1162" y="717" font-size="16" font-weight="700" fill="#24292f">EndpointSlice controller</text>
<text x="1162" y="739" font-size="14" fill="#57606a">watches Services and Pods</text>
<text x="1162" y="758" font-size="14" fill="#57606a">lists the ready pod IPs behind each Service</text>
<rect x="1150" y="793" width="370" height="139" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
<text x="1162" y="817" font-size="16" font-weight="700" fill="#24292f">kube-proxy, CoreDNS, istiod</text>
<text x="1162" y="839" font-size="14" fill="#57606a">kube-proxy: Services and EndpointSlices become</text>
<text x="1162" y="858" font-size="14" fill="#57606a">iptables rules</text>
<text x="1162" y="877" font-size="14" fill="#57606a">CoreDNS: names become ClusterIPs</text>
<text x="1162" y="896" font-size="14" fill="#57606a">istiod: everything becomes xDS for ztunnel,</text>
<text x="1162" y="915" font-size="14" fill="#57606a">waypoints, gateways</text>
<rect x="40" y="1453" width="1480" height="82" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="52" y="1477" font-size="16" font-weight="700" fill="#24292f">Nobody gives orders</text>
<text x="52" y="1499" font-size="14" fill="#57606a">Each watcher writes its result back through gates 1 to 6, like kubectl, with its own identity and RBAC role. The next watcher notices the new object. Two writers racing on one object: the second gets</text>
<text x="52" y="1518" font-size="14" fill="#57606a">409 Conflict, because its resourceVersion is stale, re-reads and tries again (optimistic concurrency).</text>
<polyline points="565.0,339 565.0,369" fill="none" stroke="#24292f" stroke-width="2" marker-end="url(#a24292f)"/>
<polyline points="565.0,527 565.0,557" fill="none" stroke="#24292f" stroke-width="2" marker-end="url(#a24292f)"/>
<polyline points="565.0,677 565.0,707" fill="none" stroke="#24292f" stroke-width="2" marker-end="url(#a24292f)"/>
<polyline points="565.0,808 565.0,838" fill="none" stroke="#24292f" stroke-width="2" marker-end="url(#a24292f)"/>
<polyline points="565.0,958 565.0,988" fill="none" stroke="#24292f" stroke-width="2" marker-end="url(#a24292f)"/>
<polyline points="290,240 350,240" fill="none" stroke="#24292f" stroke-width="2" marker-end="url(#a24292f)"/>
<text x="296" y="232" font-size="13" font-weight="600" fill="#24292f">HTTPS</text>
<polyline points="350,1048 155,1048 155,377" fill="none" stroke="#24292f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a24292f)"/>
<text x="160" y="1040" font-size="13" font-weight="600" fill="#24292f">201 Created</text>
<polyline points="780,226 820,389" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#acf222e)"/>
<polyline points="780,395 820,395" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#acf222e)"/>
<polyline points="780,583 820,507" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#acf222e)"/>
<polyline points="780,733 820,507" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#acf222e)"/>
<polyline points="780,864 820,507" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#acf222e)"/>
<polyline points="780,1018 820,1018" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a8250df)"/>
<polyline points="565.0,1108 565.0,1265" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#abc4c00)"/>
<text x="573.0" y="1191.5" font-size="13" font-weight="600" fill="#bc4c00">etcd API over a unix socket</text>
<polyline points="1070,1028 1120,1028 1120,186 1150,186" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a8250df)"/>
<polyline points="1070,1028 1120,1028 1120,324 1150,324" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a8250df)"/>
<polyline points="1070,1028 1120,1028 1120,462 1150,462" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a8250df)"/>
<polyline points="1070,1028 1120,1028 1120,600 1150,600" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a8250df)"/>
<polyline points="1070,1028 1120,1028 1120,719 1150,719" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a8250df)"/>
<polyline points="1070,1028 1120,1028 1120,819 1150,819" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a8250df)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#24292f">1. The control plane: one write, many watchers</text>
<text x="40" y="82" font-size="15" fill="#57606a">kubectl apply sends one HTTP request. Six gates decide its fate; then every interested component hears about it through a watch.</text>
<text x="1074" y="1020" font-size="13" font-weight="700" fill="#8250df">watch</text>
</svg>
