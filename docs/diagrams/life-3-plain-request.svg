<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="740" viewBox="0 0 1560 740" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1560" height="740" fill="#ffffff"/>
<defs>
<marker id="a1a7f37" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1a7f37"/></marker>
<marker id="a24292f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#24292f"/></marker>
</defs>
<rect x="40" y="140" width="1480" height="400" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="7 5"/>
<text x="52" y="164" font-size="16" font-weight="700" fill="#24292f">Node k3d-k8s-lab-server-0 (a Docker container on your Mac)</text>
<rect x="80" y="190" width="330" height="139" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
<text x="92" y="214" font-size="16" font-weight="700" fill="#24292f">client pod: 10.42.0.198</text>
<text x="92" y="236" font-size="14" fill="#57606a">curlimages/curl</text>
<text x="92" y="255" font-size="14" fill="#57606a">resolv.conf: nameserver 10.43.0.10</text>
<text x="92" y="274" font-size="14" fill="#57606a">search course-life.svc.cluster.local ...</text>
<text x="92" y="293" font-size="14" fill="#57606a">ndots:5</text>
<text x="92" y="312" font-size="14" fill="#57606a">curl http://hello</text>
<rect x="80" y="399" width="330" height="101" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
<text x="92" y="423" font-size="16" font-weight="700" fill="#24292f">CoreDNS</text>
<text x="92" y="445" font-size="14" fill="#57606a">hello has fewer than 5 dots: try</text>
<text x="92" y="464" font-size="14" fill="#57606a">hello.course-life.svc.cluster.local first</text>
<text x="92" y="483" font-size="14" fill="#57606a">answer: ClusterIP 10.43.76.137</text>
<rect x="490" y="190" width="520" height="120" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="502" y="214" font-size="16" font-weight="700" fill="#24292f">Node kernel: the nat table kube-proxy wrote</text>
<text x="502" y="236" font-size="14" fill="#57606a">KUBE-SERVICES: -d 10.43.76.137/32 --dport 80</text>
<text x="502" y="255" font-size="14" fill="#57606a">-&gt; KUBE-SVC-KJCW...: pick one endpoint (random, by probability)</text>
<text x="502" y="274" font-size="14" fill="#57606a">-&gt; KUBE-SEP-4PRS...: DNAT --to-destination 10.42.0.197:80</text>
<text x="502" y="293" font-size="14" fill="#57606a">nothing listens on 10.43.76.137: it exists only as this rule</text>
<rect x="490" y="370" width="520" height="101" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="502" y="394" font-size="16" font-weight="700" fill="#24292f">conntrack</text>
<text x="502" y="416" font-size="14" fill="#57606a">out: src=10.42.0.198 dst=10.43.76.137 dport=80</text>
<text x="502" y="435" font-size="14" fill="#57606a">back: src=10.42.0.197 dst=10.42.0.198 sport=80</text>
<text x="502" y="454" font-size="14" fill="#57606a">rewrites every reply&#x27;s source back to 10.43.76.137</text>
<rect x="1090" y="190" width="400" height="101" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="1102" y="214" font-size="16" font-weight="700" fill="#24292f">cni0 bridge</text>
<text x="1102" y="236" font-size="14" fill="#57606a">route 10.42.0.0/24 dev cni0: pods on this node</text>
<text x="1102" y="255" font-size="14" fill="#57606a">a veth pair into every pod</text>
<text x="1102" y="274" font-size="14" fill="#57606a">pods on other nodes: flannel&#x27;s VXLAN interface</text>
<rect x="1090" y="351" width="400" height="101" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
<text x="1102" y="375" font-size="16" font-weight="700" fill="#24292f">hello pod: nginx, 10.42.0.197:80</text>
<text x="1102" y="397" font-size="14" fill="#57606a">accepts a plain TCP connection</text>
<text x="1102" y="416" font-size="14" fill="#57606a">sees source 10.42.0.198, an IP and nothing more</text>
<text x="1102" y="435" font-size="14" fill="#57606a">200 OK</text>
<rect x="40" y="580" width="1480" height="120" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="52" y="604" font-size="16" font-weight="700" fill="#24292f">What scenario A lacks</text>
<text x="52" y="626" font-size="14" fill="#57606a">No identity: nginx knows an IP, and IPs change with every pod.</text>
<text x="52" y="645" font-size="14" fill="#57606a">No encryption: anyone who captures packets on the node reads the request.</text>
<text x="52" y="664" font-size="14" fill="#57606a">No policy: any pod in the cluster connects, unless a NetworkPolicy says otherwise.</text>
<text x="52" y="683" font-size="14" fill="#57606a">No per-request metrics or traces: the kernel counts packets, not HTTP requests.</text>
<polyline points="160,329 160,399" fill="none" stroke="#24292f" stroke-width="2" marker-end="url(#a24292f)"/>
<text x="168" y="368.0" font-size="13" font-weight="600" fill="#24292f">1  DNS query to 10.43.0.10:53</text>
<polyline points="330,399 330,329" fill="none" stroke="#24292f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a24292f)"/>
<polyline points="410,230 490,230" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a1a7f37)"/>
<text x="420" y="222" font-size="13" font-weight="600" fill="#1a7f37">2  SYN</text>
<polyline points="610,310 610,370" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a1a7f37)"/>
<text x="618" y="344.0" font-size="13" font-weight="600" fill="#1a7f37">3  remember the rewrite</text>
<polyline points="1010,230 1090,230" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a1a7f37)"/>
<text x="1020" y="222" font-size="13" font-weight="600" fill="#1a7f37">4  DNAT</text>
<polyline points="1210,291 1210,351" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a1a7f37)"/>
<text x="1218" y="325.0" font-size="13" font-weight="600" fill="#1a7f37">5  deliver through the veth</text>
<polyline points="1090,421 1010,420" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a1a7f37)"/>
<text x="1020" y="410" font-size="13" font-weight="600" fill="#1a7f37">6  reply</text>
<polyline points="490,440 410,299" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a1a7f37)"/>
<text x="430" y="359" font-size="13" font-weight="600" fill="#1a7f37">7  source restored</text>
<text x="40" y="52" font-size="26" font-weight="700" fill="#24292f">3. Scenario A: a request without a mesh</text>
<text x="40" y="82" font-size="15" fill="#57606a">client pod to nginx through a ClusterIP Service. The kernel does all the work; kube-proxy only wrote the rules.</text>
</svg>
