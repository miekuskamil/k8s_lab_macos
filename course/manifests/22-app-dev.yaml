apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-dev
  namespace: argocd
  # Deleting the Application also deletes what it deployed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: team-shop
  source:
    repoURL: http://gitea.course-gitops.svc.cluster.local:3000/lab/podinfo-gitops.git
    targetRevision: main
    path: envs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: course-gitops-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: false   # step 2 turns this on
