# A route timeout on the waypoint for calls to Ollama. Half a second is far too
# short for a language model, on purpose: even a two-word answer takes longer.
# Watch what a timeout does to an LLM call.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama-timeout
  namespace: shop
spec:
  parentRefs:
    - group: networking.istio.io
      kind: ServiceEntry
      name: ollama
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: host.docker.internal
          port: 11434
      timeouts:
        request: 500ms
