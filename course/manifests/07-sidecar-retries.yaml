# In sidecar mode the CLIENT's sidecar applies this VirtualService.
# Retry failed calls to httpbin up to 3 times before the application sees an error.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin
  namespace: course-sidecar
spec:
  hosts:
    - httpbin.course-sidecar.svc.cluster.local
  http:
    - retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx
      route:
        - destination:
            host: httpbin.course-sidecar.svc.cluster.local
            port:
              number: 8000
