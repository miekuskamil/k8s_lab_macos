apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: course-incident
  namespace: shop
spec:
  host: backend-v1.shop.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1
      http:
        http1MaxPendingRequests: 1
        http2MaxRequests: 1
        maxRequestsPerConnection: 1
