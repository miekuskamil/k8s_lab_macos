# Give every backend request a 1 second budget. The waypoint answers 504
# when the backend takes longer, so callers stop waiting on a slow dependency.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
  namespace: shop
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: backend
      port: 8000
  rules:
    - timeouts:
        request: 1s
      backendRefs:
        - name: backend-v1
          port: 8000
          weight: 100
        - name: backend-v2
          port: 8000
          weight: 0
