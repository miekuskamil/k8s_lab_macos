# Qwen2.5 0.5B Instruct, about 490 MB, served by llama.cpp on the CPU. Two replicas,
# each answering one request at a time (--parallel 1), so you see queueing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-qwen
  namespace: ai
  labels:
    app: llm
    model: qwen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm
      model: qwen
  template:
    metadata:
      labels:
        app: llm
        model: qwen
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      initContainers:
        # Download the model once into the shared volume. Each pod writes to its own
        # temporary file and renames it, so two pods starting together don't clash.
        - name: fetch-model
          image: curlimages/curl:8.11.1
          command: ["sh", "-c"]
          args:
            - f=/models/qwen2.5-0.5b-instruct-q4_k_m.gguf; [ -s "$f" ] || { curl -fsSL --retry 3 -o "$f.$HOSTNAME" "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" && mv "$f.$HOSTNAME" "$f"; }; ls -la /models
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-b11889
          args: ["-m", "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf", "--alias", "qwen2.5-0.5b", "--host", "0.0.0.0", "--port", "8080",
                 "--metrics", "-c", "4096", "--parallel", "1", "--threads", "2"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          # /health answers 503 while the model loads, 200 once it can serve.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
---
apiVersion: v1
kind: Service
metadata:
  name: llm-qwen
  namespace: ai
  labels:
    app: llm
    model: qwen
    metrics: scrape
spec:
  selector:
    app: llm
    model: qwen
  ports:
    - name: http
      port: 8080
      targetPort: http
