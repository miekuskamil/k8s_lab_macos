# Lock the course client in: it may only reach addresses inside the cluster (pods
# and Services). The internet stays reachable only through the waypoint, which
# runs in the cluster and applies the mesh's rules to every request.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: course-client-egress
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: course-client
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.42.0.0/16     # pod network, includes the waypoint
        - ipBlock:
            cidr: 10.43.0.0/16     # Service IPs, includes CoreDNS
