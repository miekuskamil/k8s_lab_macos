# Module 6.2: a Git server inside the cluster, so the dashboards live in a repository you push
# to, without touching the course's GitHub repo (which ArgoCD reads for the lab itself).
# Gitea keeps its data in an emptyDir: delete the pod and the repositories are gone. Fine for a lab.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: course-sre
spec:
  replicas: 1
  selector:
    matchLabels: {app: gitea}
  template:
    metadata:
      labels: {app: gitea}
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.22.6-rootless
          ports:
            - containerPort: 3000
          env:
            # Skip the web installer: SQLite, no sign-up, and a push to a new repository creates it.
            - {name: GITEA__security__INSTALL_LOCK, value: "true"}
            - {name: GITEA__database__DB_TYPE, value: sqlite3}
            - {name: GITEA__server__ROOT_URL, value: "http://gitea.course-sre.svc.cluster.local:3000/"}
            - {name: GITEA__service__DISABLE_REGISTRATION, value: "true"}
            - {name: GITEA__repository__ENABLE_PUSH_CREATE_USER, value: "true"}
            - {name: GITEA__repository__DEFAULT_PUSH_CREATE_PRIVATE, value: "false"}
          readinessProbe:
            httpGet: {path: /api/healthz, port: 3000}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/gitea}
            - {name: config, mountPath: /etc/gitea}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: config, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: course-sre
spec:
  selector: {app: gitea}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
# A receiver for Grafana's webhook notifications: it prints each JSON payload to its log.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-receiver-code
  namespace: course-sre
data:
  receiver.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200 if self.path == "/healthz" else 404)
            self.end_headers()
            self.wfile.write(b"ok\n")

        def do_POST(self):
            size = int(self.headers.get("Content-Length", "0"))
            payload = json.loads(self.rfile.read(size))
            print(json.dumps(payload), flush=True)
            self.send_response(204)
            self.end_headers()

        def log_message(self, *_):
            pass

    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: course-sre
spec:
  replicas: 1
  selector:
    matchLabels: {app: alert-receiver}
  template:
    metadata:
      labels: {app: alert-receiver}
    spec:
      containers:
        - name: receiver
          image: public.ecr.aws/docker/library/python:3.13.9-alpine3.22
          command: ["python", "/app/receiver.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
          volumeMounts:
            - {name: code, mountPath: /app}
      volumes:
        - name: code
          configMap: {name: alert-receiver-code}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: course-sre
spec:
  selector: {app: alert-receiver}
  ports:
    - {name: http, port: 8080}
