# Module 6.2: a Git server inside the cluster, so the dashboards live in a repository you push
# to, without touching the course's GitHub repo (which ArgoCD reads for the lab itself).
# Gitea keeps its data in an emptyDir: delete the pod and the repositories are gone. Fine for a lab.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: course-sre
spec:
  replicas: 1
  selector:
    matchLabels: {app: gitea}
  template:
    metadata:
      labels: {app: gitea}
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.22.6-rootless
          ports:
            - containerPort: 3000
          env:
            # Skip the web installer: SQLite, no sign-up, and a push to a new repository creates it.
            - {name: GITEA__security__INSTALL_LOCK, value: "true"}
            - {name: GITEA__database__DB_TYPE, value: sqlite3}
            - {name: GITEA__server__ROOT_URL, value: "http://gitea.course-sre.svc.cluster.local:3000/"}
            - {name: GITEA__service__DISABLE_REGISTRATION, value: "true"}
            - {name: GITEA__repository__ENABLE_PUSH_CREATE_USER, value: "true"}
            - {name: GITEA__repository__DEFAULT_PUSH_CREATE_PRIVATE, value: "false"}
          readinessProbe:
            httpGet: {path: /api/healthz, port: 3000}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/gitea}
            - {name: config, mountPath: /etc/gitea}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: config, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: course-sre
spec:
  selector: {app: gitea}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
# A receiver for Grafana's webhook notifications: it prints every request it gets to its log.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: course-sre
spec:
  replicas: 1
  selector:
    matchLabels: {app: alert-receiver}
  template:
    metadata:
      labels: {app: alert-receiver}
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:31
          env:
            - {name: HTTP_PORT, value: "8080"}
            - {name: LOG_IGNORE_PATH, value: "/healthz"}
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: course-sre
spec:
  selector: {app: alert-receiver}
  ports:
    - {name: http, port: 8080}
