# Give the MCP tool server read-only rights. Kubernetes' built-in "view" role reads
# most resources, writes nothing, and cannot read Secrets. Apply this after deleting
# the chart's cluster-admin binding (a binding's roleRef cannot change in place).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-tools-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kagent-tools
    namespace: kagent
