# Upgrade k3s on every server node to v1.31.14+k3s1, one node at a time.
# The system-upgrade-controller runs a privileged Job on the node: the
# rancher/k3s-upgrade image swaps the k3s binary and restarts k3s.
# Stay on 1.31: the lab's Istio 1.24 supports Kubernetes 1.28 to 1.31, and
# k3s, like Kubernetes, must never skip a minor version.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  version: v1.31.14+k3s1
