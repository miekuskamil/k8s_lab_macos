apiVersion: v1
kind: Namespace
metadata:
  name: course-capacity
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overprovisioned
  namespace: course-capacity
spec:
  replicas: 2
  selector:
    matchLabels: {app: overprovisioned}
  template:
    metadata:
      labels: {app: overprovisioned}
    spec:
      containers:
        - name: idle
          image: busybox:1.37.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: right-sized
  namespace: course-capacity
spec:
  replicas: 2
  selector:
    matchLabels: {app: right-sized}
  template:
    metadata:
      labels: {app: right-sized}
    spec:
      containers:
        - name: idle
          image: busybox:1.37.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
