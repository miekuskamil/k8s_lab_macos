# Module 31: a route that only matches paths under /status, with retries on 5xx.
# /status/503 runs out of retries (URX). /headers matches no route at all (NR).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin
  namespace: course-debug
spec:
  hosts:
    - httpbin
  http:
    - match:
        - uri:
            prefix: /status
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: 5xx
      route:
        - destination:
            host: httpbin
