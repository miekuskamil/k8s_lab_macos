# Module 24: a dashboard as code. Grafana's sidecar loads every ConfigMap with the
# label grafana_dashboard=1, in any namespace, and removes the dashboard when the ConfigMap goes.
apiVersion: v1
kind: Namespace
metadata:
  name: course-dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-slo-dashboard
  namespace: course-dashboards
  labels:
    grafana_dashboard: "1"
data:
  shop-slo.json: |
    {
      "uid": "shop-slo",
      "title": "Shop SLO",
      "tags": [
        "course",
        "slo"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "label": "Service",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "refresh": 2,
            "query": {
              "query": "label_values(istio_requests_total{reporter=\"waypoint\", destination_service_namespace=\"shop\", destination_canonical_service!=\"unknown\"}, destination_canonical_service)",
              "refId": "service"
            },
            "current": {
              "text": "backend",
              "value": "backend"
            }
          },
          {
            "name": "window",
            "type": "custom",
            "label": "Window",
            "query": "1m,5m,30m",
            "current": {
              "text": "5m",
              "value": "5m"
            },
            "options": [
              {
                "text": "1m",
                "value": "1m",
                "selected": false
              },
              {
                "text": "5m",
                "value": "5m",
                "selected": true
              },
              {
                "text": "30m",
                "value": "30m",
                "selected": false
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Availability over $window",
          "description": "Share of requests without a 5xx. The SLO is 99%.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "1 - (sum(rate(istio_requests_total{reporter=\"waypoint\", destination_service_namespace=\"shop\", destination_canonical_service=\"$service\", response_code=~\"5..\"}[$window])) or vector(0)) / sum(rate(istio_requests_total{reporter=\"waypoint\", destination_service_namespace=\"shop\", destination_canonical_service=\"$service\"}[$window]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "noValue": "no traffic",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Burn rate over $window",
          "description": "1 spends the error budget exactly over the SLO period. 14.4 pages.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum(rate(istio_requests_total{reporter=\"waypoint\", destination_service_namespace=\"shop\", destination_canonical_service=\"$service\", response_code=~\"5..\"}[$window])) or vector(0)) / sum(rate(istio_requests_total{reporter=\"waypoint\", destination_service_namespace=\"shop\", destination_canonical_service=\"$service\"}[$window])) / 0.01"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              },
              "noValue": "no traffic",
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Requests per second",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(istio_requests_total{reporter=\"waypoint\", destination_service_namespace=\"shop\", destination_canonical_service=\"$service\"}[$window]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "noValue": "no traffic",
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "p95 latency",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"waypoint\", destination_service_namespace=\"shop\", destination_canonical_service=\"$service\"}[$window])))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 100
                  },
                  {
                    "color": "red",
                    "value": 500
                  }
                ]
              },
              "noValue": "no traffic",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests per second by status code",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (response_code) (rate(istio_requests_total{reporter=\"waypoint\", destination_service_namespace=\"shop\", destination_canonical_service=\"$service\"}[$window]))",
              "legendFormat": "{{response_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency percentiles",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"waypoint\", destination_service_namespace=\"shop\", destination_canonical_service=\"$service\"}[$window])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"waypoint\", destination_service_namespace=\"shop\", destination_canonical_service=\"$service\"}[$window])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"waypoint\", destination_service_namespace=\"shop\", destination_canonical_service=\"$service\"}[$window])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          }
        }
      ]
    }
