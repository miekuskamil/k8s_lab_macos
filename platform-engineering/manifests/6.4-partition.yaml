# Module 6.4: cut the network between checkout and payments in both directions, for 3 minutes.
# Packets are dropped, not refused, so checkout waits for its timeout before it answers 504.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: payments-partition
  namespace: course-sre
spec:
  action: partition
  mode: all
  selector:
    namespaces: [course-sre]
    labelSelectors: {app: checkout}
  direction: both
  target:
    mode: all
    selector:
      namespaces: [course-sre]
      labelSelectors: {app: payments}
  duration: 3m
