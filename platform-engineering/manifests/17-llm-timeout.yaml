# A route timeout on the waypoint for calls to Ollama. A tenth of a second is far too
# short for a language model, on purpose: the small qwen2.5:3b needed 0.26 seconds
# for a short answer in the test run, the 14B model several seconds.
# Watch what a timeout does to an LLM call.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama-timeout
  namespace: shop
spec:
  parentRefs:
    - group: networking.istio.io
      kind: ServiceEntry
      name: ollama
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: host.docker.internal
          port: 11434
      timeouts:
        request: 100ms
