# Module 30: the same two workloads in an AMBIENT namespace, so you compare memory and
# latency with the sidecar namespace course-proxy on the same node. No waypoint: this
# measures ztunnel alone, the L4 path.
apiVersion: v1
kind: Namespace
metadata:
  name: course-ambient
  labels:
    istio.io/dataplane-mode: ambient
    app.kubernetes.io/part-of: istio-course
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: course-ambient
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client
  namespace: course-ambient
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: course-ambient
  labels:
    app: httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
        version: v1
    spec:
      serviceAccountName: httpbin
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /status/200
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: course-ambient
  labels:
    app: httpbin
spec:
  selector:
    app: httpbin
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: course-ambient
  labels:
    app: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      serviceAccountName: client
      # sleep ignores SIGTERM, so without this a rollout waits 30 seconds for the old pod.
      terminationGracePeriodSeconds: 5
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
