# One address for both models: the Service "llm" selects every model server, and
# this route on the waypoint picks one by the x-model header. Anything without
# the header goes to Qwen. The route only reads headers and paths, never the
# JSON body, so the "model" field inside the request makes no difference.
apiVersion: v1
kind: Service
metadata:
  name: llm
  namespace: ai
spec:
  selector:
    app: llm
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-by-model
  namespace: ai
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: llm
      port: 8080
  rules:
    - matches:
        - headers:
            - name: x-model
              value: smollm2
      backendRefs:
        - name: llm-smol
          port: 8080
    - backendRefs:
        - name: llm-qwen
          port: 8080
