# Module 6.4: Velero 1.18.2 (chart 12.2.2) with the AWS plugin, pointed at the SeaweedFS
# S3 gateway in course-backup.
#   helm install velero vmware-tanzu/velero --version 12.2.2 -n velero --create-namespace \
#     -f platform-engineering/manifests/6.4-velero-values.yaml
#
# The plugin teaches Velero to talk S3. An init container copies it into Velero's plugin folder.
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.3
    volumeMounts:
      - {mountPath: /target, name: plugins}
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero
      config:
        region: us-east-1
        # SeaweedFS serves buckets as paths (http://host/bucket), not as host names.
        s3ForcePathStyle: "true"
        s3Url: http://seaweedfs.course-backup.svc.cluster.local:8333
  # k3s's local-path volumes have no snapshot API, so Velero copies files instead.
  volumeSnapshotLocation: []
  uploaderType: kopia
credentials:
  useSecret: true
  secretContents:
    cloud: |
      [default]
      aws_access_key_id = velero
      aws_secret_access_key = velero-lab-secret
snapshotsEnabled: false
# The node agent reads pod volumes from the node, which file system backups need.
deployNodeAgent: true
# The chart's crds/ folder installs the CRDs, so the upgrade job and its kubectl image stay off.
upgradeCRDs: false
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 384Mi}
nodeAgent:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 512Mi}
