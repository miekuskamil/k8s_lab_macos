# Module 31, break 1. Apply it without reading it first, then find the cause with istioctl.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: httpbin
  namespace: course-debug
spec:
  host: httpbin.course-debug.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: V1
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin
  namespace: course-debug
spec:
  hosts:
    - httpbin.course-debug.svc.cluster.local
  http:
    - route:
        - destination:
            host: httpbin.course-debug.svc.cluster.local
            subset: v1
