# Task 6.4.1, the reference solution: 200 ms on packets checkout sends to payments, and nothing
# else. The selector picks checkout's network namespace; direction "from" and the target limit
# the fault to packets leaving checkout for payments' pods.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: checkout-to-payments-delay
  namespace: course-sre
spec:
  action: delay
  mode: all
  selector:
    namespaces: [course-sre]
    labelSelectors: {app: checkout}
  direction: from
  target:
    mode: all
    selector:
      namespaces: [course-sre]
      labelSelectors: {app: payments}
  delay:
    latency: 200ms
  duration: 10m
