# Task 6.2.1: a dashboard of checkout's calls to payments, as a teammate committed it.
# It loads, but its dropdown is empty and one panel shows "No data". Find both bugs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-checkout-calls
  namespace: course-sre
  labels:
    grafana_dashboard: "1"
data:
  checkout-calls.json: |
    {
      "uid": "checkout-calls",
      "title": "Checkout / calls to payments",
      "schemaVersion": 39,
      "time": {"from": "now-30m", "to": "now"},
      "templating": {"list": [
        {"name": "result", "label": "Result", "type": "query",
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "query": {"query": "label_values(checkout_payments_call_total, result)", "refId": "A"},
         "definition": "label_values(checkout_payments_call_total, result)",
         "refresh": 2, "multi": true, "includeAll": true, "allValue": ".*"}
      ]},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Calls to payments by result",
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
         "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"},
           "expr": "sum by (result) (rate(checkout_payments_calls_total{namespace=\"course-sre\", result=~\"$result\"}[$__rate_interval]))",
           "legendFormat": "{{result}}"}]},
        {"id": 2, "type": "timeseries", "title": "Orders per second",
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
         "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"},
           "expr": "sum(rate(http_request_duration_seconds_count{namespace=\"course-sre\", app=\"chekout\"}[$__rate_interval]))",
           "legendFormat": "orders"}]}
      ]
    }
