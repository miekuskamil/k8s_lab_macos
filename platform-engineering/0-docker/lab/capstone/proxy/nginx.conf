# nginx-unprivileged listens on 8080, because user 101 owns no low ports by default
# outside Docker. /healthz answers from nginx itself, everything else goes to the api.
server {
    listen 8080;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
