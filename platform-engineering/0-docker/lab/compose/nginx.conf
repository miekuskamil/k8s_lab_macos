# The proxy in front of the hits app. Docker's DNS server at 127.0.0.11 answers for the
# service name "api". The variable makes nginx ask again every 5 seconds, so it finds new
# copies of the api after docker compose up --scale.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location / {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
