# kind reads this file when create.sh builds the practice cluster. Two nodes, each a Docker
# container that runs systemd, containerd and the kubelet, joined by kubeadm the usual way.
# create.sh fills in the node image.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: practice
networking:
  disableDefaultCNI: true       # create.sh installs Calico, which enforces NetworkPolicy
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
# containerd on both nodes reads per-registry settings from /etc/containerd/certs.d, where the
# image already says that registry.practice:5000 speaks plain HTTP.
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
# The same settings as ../kubeadm-config.yaml, the file kubeadm reads on OrbStack machines and VMs.
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  clusterName: practice
- |
  kind: KubeletConfiguration
  cgroupDriver: systemd
  failSwapOn: false             # Docker Desktop and OrbStack VMs may have swap; pods stay out of it
  memorySwap:
    swapBehavior: NoSwap
- |
  kind: KubeProxyConfiguration
  conntrack:
    maxPerCore: 0               # a node container may not resize the shared kernel's conntrack table
    tcpEstablishedTimeout: 0s
    tcpCloseWaitTimeout: 0s
nodes:
- role: control-plane
  image: __IMAGE__
  # ingress-nginx listens on NodePorts 30080 and 30443 on every node; these two ports reach them
  # from your Mac at http://localhost:30080 and https://localhost:30443.
  extraPortMappings:
  - {containerPort: 30080, hostPort: 30080, listenAddress: 127.0.0.1}
  - {containerPort: 30443, hostPort: 30443, listenAddress: 127.0.0.1}
- role: worker
  image: __IMAGE__
